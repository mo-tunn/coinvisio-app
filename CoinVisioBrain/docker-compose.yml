version: '3.8'

services:
  ingestion:
    build: ./services/ingestion
    container_name: coinvisio_ingestion
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./services/ingestion:/app
      - ./data_pipeline:/app/data_pipeline
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: coinvisio_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  analysis:
    build: ./services/analysis
    container_name: coinvisio_analysis
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./services/analysis:/app
      - ./data_pipeline:/app/data_pipeline
    depends_on:
      - redis

  irisai:
    build: ./services/irisai
    container_name: coinvisio_irisai
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./services/irisai:/app
      - ./data_pipeline:/app/data_pipeline
    depends_on:
      - redis

  rl_optimizer:
    build: ./services/rl_optimizer
    container_name: coinvisio_rl_optimizer
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./services/rl_optimizer:/app
      - ./data_pipeline:/app/data_pipeline
    depends_on:
      - redis


volumes:
  redis_data:

networks:
  default:
    name: coinvisio_network
